[project]
name = "beyin-web"
version = "0.2.0"
description = "Local web interface for an avenoxbeyin (Beyin) vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
e2e = ["selenium>=4.20"]

[project.scripts]
beyin-web = "beyin_web.__main__:main"

[tool.setuptools.packages.find]
include = ["beyin_web*"]

[tool.setuptools.package-data]
beyin_web = ["static/*", "static/**/*", "assets/*"]
